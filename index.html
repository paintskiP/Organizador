<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Meu Organizador</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--text:#1d2320;--muted:#5b6661;--line:#dedcd4;--acc:#0f766e;--acct:#fff;--bad:#b42318;--badbg:#fde8e6;--warn:#8a5208;--warnbg:#fdf0d5;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bg)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121715;--card:#1b2220;--text:#eaf0ed;--muted:#9aa6a0;--line:#2c3733;--acc:#2dd4bf;--acct:#06201d;--bad:#ff8a80;--badbg:#3a1b18;--warn:#f5c46b;--warnbg:#3a2c10;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121715;--card:#1b2220;--text:#eaf0ed;--muted:#9aa6a0;--line:#2c3733;--acc:#2dd4bf;--acct:#06201d;--bad:#ff8a80;--badbg:#3a1b18;--warn:#f5c46b;--warnbg:#3a2c10;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
h1{font-size:1.4rem;margin:0}
h3{margin:0 0 4px;font-size:1.05rem;word-break:break-word}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--card);border:1px solid var(--line);padding:5px;border-radius:14px;margin-bottom:16px}
.tab{border:0;background:none;color:var(--text);font:inherit;font-weight:600;min-height:46px;border-radius:10px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--acc);color:var(--acct)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.form{display:grid;gap:10px}
input,textarea{width:100%;font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;min-height:46px}
textarea{resize:vertical}
input:focus,textarea:focus,button:focus-visible{outline:3px solid var(--acc);outline-offset:1px}
#nq{margin-bottom:12px}
.grid2{display:grid;gap:10px;grid-template-columns:1fr}
@media(min-width:560px){.grid2{grid-template-columns:1fr 1fr}}
label.f{display:grid;gap:4px;font-size:.85rem;color:var(--muted)}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.form .acts{margin-top:0}
.center{justify-content:center}
.btn{font:inherit;font-weight:600;min-height:46px;padding:0 18px;border-radius:12px;border:1px solid var(--acc);background:var(--acc);color:var(--acct);cursor:pointer}
.btn.ghost{background:none;color:var(--text);border-color:var(--line)}
.btn.sm{min-height:40px;padding:0 12px;font-size:.9rem}
.btn.big{min-height:56px;padding:0 28px;font-size:1.1rem}
.danger{color:var(--bad)!important}
.note p{margin:0;white-space:pre-wrap;word-break:break-word}
.pinned{border-color:var(--acc)}
.seg{display:flex;gap:6px;margin-bottom:12px}
.seg button{flex:1;font:inherit;font-weight:600;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--acc);color:var(--acct);border-color:var(--acc)}
.task{display:flex;gap:12px;align-items:flex-start}
.cb{width:26px;height:26px;min-height:0;margin-top:2px;accent-color:var(--acc);flex:none}
.tb{flex:1;min-width:0}
.meta{margin:0;color:var(--muted);font-size:.9rem}
.late{border-left:5px solid var(--bad);background:var(--badbg)}
.soon{border-left:5px solid var(--warn);background:var(--warnbg)}
.done{opacity:.65}
.done h3{text-decoration:line-through}
.clockcard{text-align:center;padding:22px 14px}
.phase{font-weight:700;color:var(--acc);letter-spacing:.04em;text-transform:uppercase;font-size:.9rem}
.clock{font-size:clamp(3.4rem,20vw,6rem);font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1;margin:6px 0 14px}
.alarm{background:var(--warnbg);color:var(--warn);font-weight:700;border-radius:10px;padding:10px;margin-bottom:12px;animation:fl 1s ease 3}
@keyframes fl{50%{opacity:.35}}
#cfg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.today{text-align:center;font-size:1.1rem}
.empty{text-align:center;color:var(--muted);padding:20px 0}
.sw{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sw button{width:34px;height:34px;min-height:0;padding:0;border-radius:50%;border:2px solid var(--line);background:var(--nc,var(--card));color:var(--muted);font:inherit;cursor:pointer}
.sw button[aria-pressed="true"]{box-shadow:0 0 0 3px var(--acc)}
.c-y{--nc:#e0a800}.c-g{--nc:#2e9e5b}.c-b{--nc:#2f7de1}.c-p{--nc:#d6458a}.c-v{--nc:#8a5cf6}
.note.col{border-left:6px solid var(--nc);background:color-mix(in srgb,var(--nc) 14%,var(--card))}
#alert{background:var(--warnbg);color:var(--warn);border:1px solid var(--warn);border-radius:12px;padding:10px 14px;margin-bottom:14px;font-weight:600;cursor:pointer}
.hint{color:var(--muted);font-size:.85rem;margin:0 0 12px}
#bell{margin-bottom:8px}
select{width:100%;font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;min-height:46px}
.studied{color:var(--acc);font-weight:600}
.det{margin-top:8px}
.det summary{cursor:pointer;font-weight:600;color:var(--acc);min-height:36px;display:flex;align-items:center}
.det textarea{margin-top:6px}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--acc);width:0}
.ctr{text-align:center}
.wk{display:flex;gap:6px;align-items:flex-end}
.wk .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.75rem;color:var(--muted)}
.wk .b{width:100%;height:90px;background:var(--bg);border-radius:6px;position:relative;overflow:hidden}
.wk .b i{position:absolute;left:0;right:0;bottom:0;background:var(--acc)}
.wk .hoje span:last-child{color:var(--text);font-weight:700}
.steps{list-style:none;margin:8px 0;padding:0;display:grid;gap:6px}
.steps li{display:flex;align-items:center;gap:8px}
.steps label{flex:1;display:flex;align-items:center;gap:8px;min-width:0;word-break:break-word}
.steps input[type=checkbox]{width:22px;height:22px;min-height:0;accent-color:var(--acc);flex:none}
.steps .x{background:none;border:0;color:var(--muted);font-size:1.3rem;min-width:40px;min-height:40px;cursor:pointer}
.addst{display:flex;gap:8px;margin-bottom:6px}
.pill{display:inline-block;font-size:.75rem;font-weight:700;padding:1px 8px;border-radius:99px;background:var(--line);color:var(--muted);margin-right:6px}
.pill.a{background:var(--badbg);color:var(--bad)}
#bk{margin-top:16px}
#bk summary{cursor:pointer;font-weight:600;min-height:36px;display:flex;align-items:center}
</style>
</head>
<body>
<div class="wrap">
<header><h1>Meu Organizador</h1><button id="theme" class="btn ghost sm" aria-label="Alternar tema claro ou escuro">🌓</button></header>
<nav class="tabs" role="tablist">
<button class="tab" data-t="notas" role="tab" aria-selected="true">📝 Notas</button>
<button class="tab" data-t="prazos" role="tab" aria-selected="false">📅 Prazos</button>
<button class="tab" data-t="estudo" role="tab" aria-selected="false">⏱️ Estudo</button>
</nav>

<div id="alert" role="status" hidden></div>

<section id="notas">
<div class="card form">
<input id="nt" placeholder="Título da nota" maxlength="120" aria-label="Título da nota">
<textarea id="nx" rows="4" placeholder="Escreva sua nota…" aria-label="Texto da nota"></textarea>
<div class="sw" id="sw" aria-label="Cor da nota">
<button data-c="" aria-label="Sem cor" aria-pressed="true">×</button>
<button class="c-y" data-c="y" aria-label="Amarelo" aria-pressed="false"></button>
<button class="c-g" data-c="g" aria-label="Verde" aria-pressed="false"></button>
<button class="c-b" data-c="b" aria-label="Azul" aria-pressed="false"></button>
<button class="c-p" data-c="p" aria-label="Rosa" aria-pressed="false"></button>
<button class="c-v" data-c="v" aria-label="Roxo" aria-pressed="false"></button>
</div>
<div class="acts"><button id="nsave" class="btn">Salvar nota</button><button id="ncancel" class="btn ghost" hidden>Cancelar</button></div>
</div>
<input id="nq" type="search" placeholder="🔎 Buscar nas notas" aria-label="Buscar nas notas">
<div id="nlist"></div>
</section>

<section id="prazos" hidden>
<div class="card form">
<input id="tt" placeholder="Título do trabalho" maxlength="120" aria-label="Título do trabalho">
<div class="grid2">
<label class="f">Matéria ou categoria (opcional)<input id="tc" maxlength="60"></label>
<label class="f">Data do prazo<input id="td" type="date"></label>
</div>
<div class="grid2">
<label class="f">Horário do prazo (opcional)<input id="th" type="time"></label>
<label class="f">Prioridade<select id="tp"><option value="a">Alta</option><option value="m" selected>Média</option><option value="b">Baixa</option></select></label>
</div>
<div class="acts"><button id="tsave" class="btn">Adicionar trabalho</button><button id="tcancel" class="btn ghost" hidden>Cancelar</button></div>
</div>
<button id="bell" class="btn ghost sm" hidden>🔔 Ativar avisos de prazo</button>
<p class="hint" id="bmsg"></p>
<div class="seg" id="flt"><button data-f="pend" aria-pressed="true">Pendentes</button><button data-f="done" aria-pressed="false">Concluídos</button><button data-f="all" aria-pressed="false">Todos</button></div>
<div id="tlist"></div>
</section>

<section id="estudo" hidden>
<div class="seg" id="modes"><button data-m="pomo" aria-pressed="true">Pomodoro</button><button data-m="free" aria-pressed="false">Cronômetro livre</button></div>
<div class="card"><label class="f">Estudando para<select id="stask"></select></label></div>
<div class="card clockcard">
<div id="phase" class="phase"></div>
<div id="clock" class="clock">25:00</div>
<div id="alarm" class="alarm" role="status" hidden></div>
<div class="acts center"><button id="go" class="btn big">Iniciar</button><button id="reset" class="btn ghost big">Zerar</button></div>
</div>
<div class="card" id="cfg">
<label class="f">Foco (minutos)<input id="sf" type="number" min="1" max="180" inputmode="numeric"></label>
<label class="f">Pausa (minutos)<input id="sb" type="number" min="1" max="60" inputmode="numeric"></label>
</div>
<p class="today">Estudado hoje: <b id="today">0 min</b></p>
<div class="bar" id="gb"><i id="gbar"></i></div>
<p class="hint ctr" id="gtxt"></p>
<div class="card"><label class="f">Meta de estudo por dia (minutos; 0 desliga)<input id="sg" type="number" min="0" max="1440" inputmode="numeric"></label></div>
<div class="card"><h3>Últimos 7 dias</h3><div class="wk" id="wk"></div><p class="hint ctr" id="streak"></p></div>
</section>
<details class="card" id="bk"><summary>💾 Cópia de segurança</summary>
<p class="hint">Baixe um arquivo com suas notas, prazos e tempo de estudo. Guarde-o fora do app, por exemplo enviando para você mesmo no WhatsApp ou salvando no Google Drive.</p>
<div class="acts"><button id="bexp" class="btn sm">Baixar cópia</button><button id="bimp" class="btn ghost sm">Restaurar cópia</button></div>
<input id="bfile" type="file" accept=".json,application/json" hidden>
<p class="hint" id="bkmsg"></p>
</details>
</div>

<script>
const KEY='organizador-v1';
let S={notes:[],tasks:[],focus:25,brk:5,log:{},tlog:{},cur:'',nd:'',goal:120,theme:null};
try{const r=localStorage.getItem(KEY);if(r)Object.assign(S,JSON.parse(r))}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const $=s=>document.querySelector(s);
const $$=s=>document.querySelectorAll(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const pad2=n=>String(n).padStart(2,'0');
const nowHM=()=>{const d=new Date();return pad2(d.getHours())+':'+pad2(d.getMinutes())};
const lateT=(t,df)=>df<0||(df===0&&!!t.h&&t.h<nowHM());
const hs=t=>t.h?' às '+t.h:'';
const PN={a:'Alta',m:'Média',b:'Baixa'},PR={a:3,m:2,b:1};
const sh=m=>m<60?m+'m':Math.floor(m/60)+'h'+(m%60?pad2(m%60):'');
const openD=new Set();
const stN=t=>{const l=t.st||[];return[l.filter(x=>x.d).length,l.length]};
const stMeta=t=>{const[a,n]=stN(t);return n?' · '+a+'/'+n+' etapas':''};
const stBar=t=>{const[a,n]=stN(t);return n?'<div class="bar"><i style="width:'+Math.round(a/n*100)+'%"></i></div>':''};
const stHtml=t=>'<ul class="steps">'+(t.st||[]).map((x,i)=>`<li><label><input type="checkbox" class="sc" data-id="${t.id}" data-i="${i}"${x.d?' checked':''}><span>${esc(x.x)}</span></label><button class="x" data-a="sdel" data-id="${t.id}" data-i="${i}" aria-label="Remover etapa">×</button></li>`).join('')+'</ul><div class="addst"><input class="sn" placeholder="Nova etapa…" maxlength="100" aria-label="Nova etapa"><button class="btn sm" data-a="sadd" data-id="'+t.id+'" aria-label="Adicionar etapa">+</button></div>';
const fmtMin=ms=>{const t=Math.floor(ms/60000),h=Math.floor(t/60);return (h?h+' h ':'')+(t%60)+' min'};
function confirmDel(b,fn){
  if(b.dataset.armed){fn();return}
  b.dataset.armed=1;const old=b.textContent;b.textContent='Confirmar?';
  setTimeout(()=>{if(b.isConnected){delete b.dataset.armed;b.textContent=old}},3000);
}

/* Tema */
if(S.theme)document.documentElement.dataset.theme=S.theme;
$('#theme').onclick=()=>{
  const r=document.documentElement,t=r.dataset.theme;
  const dark=t?t==='dark':matchMedia('(prefers-color-scheme: dark)').matches;
  S.theme=dark?'light':'dark';r.dataset.theme=S.theme;save();
};

/* Abas */
$$('.tab').forEach(b=>b.onclick=()=>{
  $$('.tab').forEach(x=>x.setAttribute('aria-selected',x===b));
  $$('section').forEach(s=>s.hidden=s.id!==b.dataset.t);
  renderTasks();
});

/* Notas */
let editN=null,curC='';
function renderNotes(){
  const q=$('#nq').value.trim().toLowerCase();
  const l=S.notes.filter(n=>(n.t+' '+n.x).toLowerCase().includes(q));
  l.sort((a,b)=>(b.pin?1:0)-(a.pin?1:0)||b.u-a.u);
  $('#nlist').innerHTML=l.length?l.map(n=>`<article class="card note${n.pin?' pinned':''}${n.col?' col c-'+n.col:''}"><h3>${n.pin?'📌 ':''}${esc(n.t||'Sem título')}</h3><p>${esc(n.x)}</p><div class="acts"><button class="btn ghost sm" data-a="npin" data-id="${n.id}">${n.pin?'Desafixar':'Fixar'}</button><button class="btn ghost sm" data-a="nedit" data-id="${n.id}">Editar</button><button class="btn ghost sm danger" data-a="ndel" data-id="${n.id}">Apagar</button></div></article>`).join(''):`<p class="empty">${S.notes.length?'Nenhuma nota encontrada.':'Nenhuma nota ainda. Escreva a primeira acima.'}</p>`;
}
function resetN(){editN=null;setC('');$('#nt').value='';$('#nx').value='';$('#nsave').textContent='Salvar nota';$('#ncancel').hidden=true}
$('#nsave').onclick=()=>{
  const t=$('#nt').value.trim(),x=$('#nx').value.trim();
  if(!t&&!x){$('#nt').focus();return}
  if(editN){const n=S.notes.find(n=>n.id===editN);if(n){n.t=t;n.x=x;n.col=curC;n.u=Date.now()}}
  else S.notes.push({id:uid(),t,x,col:curC,pin:false,u:Date.now()});
  resetN();save();renderNotes();
};
$('#ncancel').onclick=resetN;
function setC(c){curC=c;$$('#sw button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.c===c))}
$('#sw').onclick=e=>{const b=e.target.closest('button');if(b)setC(b.dataset.c)};
$('#nq').oninput=renderNotes;
$('#nlist').onclick=e=>{
  const b=e.target.closest('button');if(!b)return;
  const id=b.dataset.id,a=b.dataset.a,n=S.notes.find(n=>n.id===id);
  if(a==='npin'){n.pin=!n.pin;save();renderNotes()}
  else if(a==='nedit'){editN=id;setC(n.col||'');$('#nt').value=n.t;$('#nx').value=n.x;$('#nsave').textContent='Salvar alterações';$('#ncancel').hidden=false;$('#nt').focus();scrollTo({top:0,behavior:'smooth'})}
  else if(a==='ndel')confirmDel(b,()=>{S.notes=S.notes.filter(n=>n.id!==id);if(editN===id)resetN();save();renderNotes()});
};

/* Prazos */
let editT=null,flt='pend';
const dayStart=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate());
function dueDiff(s){const[y,m,d]=s.split('-').map(Number);return Math.round((new Date(y,m-1,d)-dayStart(new Date()))/864e5)}
const fmtD=s=>s.split('-').reverse().join('/');
function renderTasks(){
  const l=S.tasks.filter(t=>flt==='all'||(flt==='done')===t.done);
  l.sort((a,b)=>(a.done-b.done)||(a.d+(a.h||'24:00')).localeCompare(b.d+(b.h||'24:00'))||PR[b.p||'m']-PR[a.p||'m']);
  $('#tlist').innerHTML=l.length?l.map(t=>{
    const df=dueDiff(t.d);let cls='',lb;
    if(t.done){cls='done';lb='Concluído'}
    else if(df===0&&lateT(t,0)){cls='late';lb='Atrasado desde '+t.h}
    else if(df<0){cls='late';lb='Atrasado há '+(-df)+(df===-1?' dia':' dias')}
    else if(df===0){cls='soon';lb='Vence hoje'+hs(t)}
    else if(df===1){cls='soon';lb='Vence amanhã'+hs(t)}
    else{cls=df<=3?'soon':'';lb='Faltam '+df+' dias'}
    return `<article class="card task ${cls}"><input type="checkbox" class="cb" data-id="${t.id}" aria-label="Marcar como concluído"${t.done?' checked':''}><div class="tb"><h3>${esc(t.t)}</h3><p class="meta"><span class="pill${t.p==='a'?' a':''}">${PN[t.p||'m']}</span>${t.c?esc(t.c)+' · ':''}Prazo: ${fmtD(t.d)}${hs(t)} · <b>${lb}</b>${(S.tlog[t.id]||0)>=60000?' · <span class="studied">⏱ '+fmtMin(S.tlog[t.id])+'</span>':''}${stMeta(t)}</p>${stBar(t)}<details class="det" data-id="${t.id}"${openD.has(t.id)?' open':''}><summary>📝 Detalhes${t.det||(t.st&&t.st.length)?' •':''}</summary>${stHtml(t)}<textarea class="dt" data-id="${t.id}" rows="4" aria-label="Detalhes do trabalho" placeholder="Anote aqui o que precisa ser feito, etapas, links…">${esc(t.det||'')}</textarea></details><div class="acts"><button class="btn ghost sm" data-a="tedit" data-id="${t.id}">Editar</button><button class="btn ghost sm danger" data-a="tdel" data-id="${t.id}">Apagar</button></div></div></article>`;
  }).join(''):'<p class="empty">Nenhum trabalho nesta lista.</p>';
  fillSel();drawAlert();
}
function resetT(){editT=null;['#tt','#tc','#td','#th'].forEach(s=>$(s).value='');$('#tp').value='m';$('#tsave').textContent='Adicionar trabalho';$('#tcancel').hidden=true}
$('#tsave').onclick=()=>{
  const t=$('#tt').value.trim(),c=$('#tc').value.trim(),d=$('#td').value,h=$('#th').value,p=$('#tp').value;
  if(!t){$('#tt').focus();return}
  if(!d){$('#td').focus();return}
  if(editT){const k=S.tasks.find(k=>k.id===editT);if(k){k.t=t;k.c=c;k.d=d;k.h=h;k.p=p}}
  else S.tasks.push({id:uid(),t,c,d,h,p,done:false,st:[]});
  resetT();save();renderTasks();
};
$('#tcancel').onclick=resetT;
$('#flt').onclick=e=>{
  const b=e.target.closest('button');if(!b)return;
  flt=b.dataset.f;$$('#flt button').forEach(x=>x.setAttribute('aria-pressed',x===b));renderTasks();
};
$('#tlist').onkeydown=e=>{if(e.key==='Enter'&&e.target.classList.contains('sn'))e.target.nextElementSibling.click()};
$('#tlist').addEventListener('toggle',e=>{const d=e.target;if(d.tagName==='DETAILS'&&d.dataset.id)d.open?openD.add(d.dataset.id):openD.delete(d.dataset.id)},true);
$('#tlist').oninput=e=>{
  if(!e.target.classList.contains('dt'))return;
  const t=S.tasks.find(t=>t.id===e.target.dataset.id);
  if(t){t.det=e.target.value;save()}
};
$('#tlist').onchange=e=>{
  const c=e.target.classList;
  if(c.contains('sc')){const t=S.tasks.find(t=>t.id===e.target.dataset.id),i=+e.target.dataset.i;if(t&&t.st[i]){t.st[i].d=e.target.checked;save();renderTasks()}return}
  if(!c.contains('cb'))return;
  const t=S.tasks.find(t=>t.id===e.target.dataset.id);
  if(t){t.done=e.target.checked;save();renderTasks()}
};
$('#tlist').onclick=e=>{
  const b=e.target.closest('button');if(!b)return;
  const id=b.dataset.id,a=b.dataset.a,t=S.tasks.find(t=>t.id===id);
  if(a==='sadd'){const x=b.previousElementSibling.value.trim();if(x&&t){(t.st=t.st||[]).push({x,d:false});save();renderTasks();const n=$('#tlist details[data-id="'+id+'"] .sn');if(n)n.focus()}}
  else if(a==='sdel'){if(t){t.st.splice(+b.dataset.i,1);save();renderTasks()}}
  else if(a==='tedit'){editT=id;$('#tt').value=t.t;$('#tc').value=t.c||'';$('#td').value=t.d;$('#th').value=t.h||'';$('#tp').value=t.p||'m';$('#tsave').textContent='Salvar alterações';$('#tcancel').hidden=false;$('#tt').focus();scrollTo({top:0,behavior:'smooth'})}
  else if(a==='tdel')confirmDel(b,()=>{S.tasks=S.tasks.filter(t=>t.id!==id);delete S.tlog[id];if(S.cur===id)S.cur='';if(editT===id)resetT();save();renderTasks()});
};

/* Estudo */
let mode='pomo',phase='focus',acc=0,run=false,last=0,tick=null,lastSave=0,ac=null;
const tk=(d=new Date())=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const phaseMs=()=>(phase==='focus'?S.focus:S.brk)*60000;
function fmt(ms,up){
  const s=up?Math.floor(ms/1000):Math.max(0,Math.ceil(ms/1000));
  const h=Math.floor(s/3600),m=Math.floor(s%3600/60),r=s%60;
  return (h?h+':':'')+String(m).padStart(2,'0')+':'+String(r).padStart(2,'0');
}
function drawStudy(){
  const up=mode==='free';
  $('#clock').textContent=fmt(up?acc:phaseMs()-acc,up);
  $('#phase').textContent=up?'Cronômetro livre':phase==='focus'?'Foco':'Pausa';
  $('#go').textContent=run?'Pausar':'Iniciar';
  const t=Math.floor((S.log[tk()]||0)/60000),h=Math.floor(t/60);
  $('#today').textContent=(h?h+' h ':'')+(t%60)+' min';
  const g=S.goal||0;$('#gb').hidden=!g;$('#gtxt').textContent=g?(t>=g?'🎉 Meta de '+g+' min batida!':'Meta de hoje: '+t+' de '+g+' min'):'';
  if(g)$('#gbar').style.width=Math.min(100,Math.round(t/g*100))+'%';
}
function unlock(){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume()}catch(e){}}
function beep(){
  try{
    unlock();
    [0,.35,.7].forEach(t=>{
      const o=ac.createOscillator(),g=ac.createGain(),n=ac.currentTime+t;
      o.frequency.value=880;g.gain.setValueAtTime(.25,n);g.gain.exponentialRampToValueAtTime(.001,n+.25);
      o.connect(g);g.connect(ac.destination);o.start(n);o.stop(n+.3);
    });
    if(navigator.vibrate)navigator.vibrate([200,100,200]);
  }catch(e){}
}
function start(){run=true;last=Date.now();$('#alarm').hidden=true;tick=setInterval(step,250);unlock();drawStudy()}
function stop(){run=false;clearInterval(tick);save();drawStudy();drawWeek()}
function finish(){
  stop();const was=phase;phase=was==='focus'?'break':'focus';acc=0;beep();
  const a=$('#alarm');a.hidden=false;
  a.textContent=was==='focus'?'Foco concluído! Hora de uma pausa. 🎉':'A pausa terminou. Vamos voltar ao foco!';
  drawStudy();
}
function step(){
  const now=Date.now();let d=now-last;last=now;
  if(mode==='pomo')d=Math.max(0,Math.min(d,phaseMs()-acc));
  acc+=d;
  if(mode==='free'||phase==='focus'){S.log[tk()]=(S.log[tk()]||0)+d;if(S.cur)S.tlog[S.cur]=(S.tlog[S.cur]||0)+d}
  if(mode==='pomo'&&acc>=phaseMs()){finish();return}
  if(now-lastSave>5000){save();lastSave=now;drawWeek()}
  drawStudy();
}
$('#go').onclick=()=>run?stop():start();
$('#reset').onclick=()=>{stop();acc=0;phase='focus';$('#alarm').hidden=true;drawStudy()};
$('#modes').onclick=e=>{
  const b=e.target.closest('button');if(!b)return;
  mode=b.dataset.m;stop();acc=0;phase='focus';$('#alarm').hidden=true;$('#cfg').hidden=mode==='free';
  $$('#modes button').forEach(x=>x.setAttribute('aria-pressed',x===b));drawStudy();
};
const clamp=(v,a,b,f)=>{v=parseInt(v,10);return isNaN(v)?f:Math.min(b,Math.max(a,v))};
$('#sf').value=S.focus;$('#sb').value=S.brk;
$('#sf').onchange=()=>{S.focus=clamp($('#sf').value,1,180,25);$('#sf').value=S.focus;save();drawStudy()};
$('#sb').onchange=()=>{S.brk=clamp($('#sb').value,1,60,5);$('#sb').value=S.brk;save();drawStudy()};
$('#sg').value=S.goal;
$('#sg').onchange=()=>{S.goal=clamp($('#sg').value,0,1440,120);$('#sg').value=S.goal;save();drawStudy();drawWeek()};
function drawWeek(){
  const days=[];for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);days.push(d)}
  const mins=days.map(d=>Math.floor((S.log[tk(d)]||0)/60000)),mx=Math.max(S.goal||0,...mins,1);
  $('#wk').innerHTML=days.map((d,i)=>`<div class="col${i===6?' hoje':''}"><span>${mins[i]?sh(mins[i]):'–'}</span><div class="b"><i style="height:${Math.round(mins[i]/mx*100)}%"></i></div><span>${['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'][d.getDay()]}</span></div>`).join('');
  let n=0;const d=new Date();if(!(S.log[tk(d)]>=60000))d.setDate(d.getDate()-1);
  while(S.log[tk(d)]>=60000){n++;d.setDate(d.getDate()-1)}
  $('#streak').textContent=n?'🔥 '+n+(n===1?' dia seguido':' dias seguidos')+' estudando':'Estude hoje para começar uma sequência.';
}

/* Cópia de segurança */
$('#bexp').onclick=()=>{
  try{
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));
    a.download='organizador-'+tk()+'.json';document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);
    $('#bkmsg').textContent='Cópia baixada. Procure o arquivo na pasta Downloads.';
  }catch(e){$('#bkmsg').textContent='Não foi possível baixar a cópia neste navegador.'}
};
$('#bimp').onclick=()=>$('#bfile').click();
$('#bfile').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      if(!d||!Array.isArray(d.notes)||!Array.isArray(d.tasks))throw 0;
      if(!confirm('Restaurar esta cópia vai substituir tudo o que está no app agora. Continuar?'))return;
      S=Object.assign({notes:[],tasks:[],focus:25,brk:5,log:{},tlog:{},cur:'',nd:'',goal:120,theme:S.theme},d);
      save();location.reload();
    }catch(x){$('#bkmsg').textContent='Esse arquivo não parece ser uma cópia do Organizador.'}
  };
  r.readAsText(f);e.target.value='';
};
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
addEventListener('pagehide',save);

function fillSel(){
  const l=S.tasks.filter(t=>!t.done).sort((a,b)=>a.d.localeCompare(b.d));
  if(S.cur&&!l.some(t=>t.id===S.cur))S.cur='';
  $('#stask').innerHTML='<option value="">Estudo livre (sem trabalho)</option>'+l.map(t=>`<option value="${t.id}"${t.id===S.cur?' selected':''}>${esc(t.t)}</option>`).join('');
}
$('#stask').onchange=e=>{S.cur=e.target.value;save()};

/* Avisos de prazo */
function dueList(){
  return S.tasks.filter(t=>!t.done).map(t=>{const df=dueDiff(t.d);return{t,df,late:lateT(t,df)}}).filter(x=>x.df<=1).sort((a,b)=>a.df-b.df);
}
function drawAlert(){
  const l=dueList(),a=$('#alert');
  if(!l.length){a.hidden=true;return}
  const late=l.filter(x=>x.late).length,td=l.filter(x=>x.df===0&&!x.late).length,tm=l.filter(x=>x.df===1).length,p=[];
  if(late)p.push(late+(late===1?' atrasado':' atrasados'));
  if(td)p.push(td+(td===1?' vence hoje':' vencem hoje'));
  if(tm)p.push(tm+(tm===1?' vence amanhã':' vencem amanhã'));
  a.textContent='⚠️ Prazos: '+p.join(' · ');
  a.hidden=false;
}
$('#alert').onclick=()=>$('.tab[data-t="prazos"]').click();
function drawBell(){
  const b=$('#bell'),m=$('#bmsg');
  if(!('Notification' in window)){b.hidden=true;m.textContent='Este navegador não oferece avisos do sistema, mas o alerta no topo da tela continua funcionando.';return}
  const p=Notification.permission;
  b.hidden=p!=='default';
  m.textContent=p==='granted'?'🔔 Avisos ativados. Eles aparecem quando você abre o app, uma vez por dia. Com o app fechado, o celular não consegue avisar.':p==='denied'?'Os avisos estão bloqueados. Para ativar, libere as notificações deste app nas configurações do Chrome.':'Os avisos aparecem quando você abre o app, uma vez por dia.';
}
$('#bell').onclick=()=>{try{Promise.resolve(Notification.requestPermission()).then(()=>{drawBell();notify()})}catch(e){}};
function notify(){
  drawAlert();
  if(!('Notification' in window)||Notification.permission!=='granted'||S.nd===tk())return;
  const l=dueList();if(!l.length)return;
  S.nd=tk();save();
  const title='⚠️ Prazos de trabalho';
  const o={body:l.slice(0,3).map(x=>x.t.t+' ('+(x.late?'atrasado':x.df===0?'vence hoje':'vence amanhã')+')').join('\n'),icon:'icon-192.png',tag:'prazos'};
  const fb=()=>{try{new Notification(title,o)}catch(e){}};
  if(navigator.serviceWorker&&navigator.serviceWorker.ready)navigator.serviceWorker.ready.then(r=>r.showNotification(title,o)).catch(fb);else fb();
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)notify()});
setInterval(notify,60000);

renderNotes();renderTasks();drawStudy();drawWeek();drawBell();notify();
</script>
